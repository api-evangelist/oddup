aid: oddup
name: Oddup
description: 'Oddup (now operating as Oddup Markets) is a Singapore-based platform founded in 2015 by James
  Giancotti. It began as a data-driven startup-rating and intelligence service — a 500 Global portfolio company
  scoring startups and crypto projects — and has since pivoted to prediction markets, letting users trade on
  real-world outcomes across crypto, FX, indices, and commodities using a distinctive Yes / No / Maybe outcome
  model. The current product is a client-side single-page web application hosted on Vercel at oddup.app (and
  oddup.com). As of this enrichment pass the live site is geo-restricted (HTTP 451, x-blocked-country: US) and
  exposes no public developer, API, documentation, or .well-known surface — no OpenAPI, no API subdomains, and
  no published packages were discoverable. This profile therefore captures verified company identity and a
  domain-security probe only; it will be re-enriched if a public API surface appears.'
